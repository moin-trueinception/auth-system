openapi: 3.0.0
info:
  title: Auth System API
  version: 1.0.0
  description: API for managing authentication and authorization in the system

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ### ================= AUTH =================

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
        newPassword:
          type: string

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong

    ### ================= PROFILE =================

    Profile:
      type: object
      properties:
        _id:
          type: string
        fullname:
          type: string
        age:
          type: integer
        bio:
          type: string
        avatarUrl:
          type: string
        address:
          type: string
        contact:
          type: string
        userId:
          type: string
      example:
        _id: "65f123abc456"
        fullname: "Moin Shaikh"
        age: 22
        bio: "Full stack developer"
        avatarUrl: "https://example.com/avatar.jpg"
        address: "Mumbai, India"
        contact: "+919876543210"
        userId: "65fuser123"

    ProfileRequest:
      type: object
      properties:
        fullname:
          type: string
        age:
          type: integer
        bio:
          type: string
        avatarUrl:
          type: string
        address:
          type: string
        contact:
          type: string

paths:

  ### ================= AUTH ROUTES =================

  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      summary: Login user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        "200":
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/auth/reset-password:
    post:
      summary: Reset password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      summary: Logout user
      security:
        - bearerAuth: []
      tags: [Authentication]
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  ### ================= PROFILE ROUTES =================

  /api/profile:
    post:
      summary: Create profile
      security:
        - bearerAuth: []
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

    get:
      summary: Get logged-in user profile
      security:
        - bearerAuth: []
      tags: [Profile]
      responses:
        "200":
          description: Profile fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        "404":
          description: Profile not found

    put:
      summary: Update profile
      security:
        - bearerAuth: []
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

    delete:
      summary: Delete profile
      security:
        - bearerAuth: []
      tags: [Profile]
      responses:
        "200":
          description: Profile deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/profile/all:
    get:
      summary: Get all profiles (Admin only)
      security:
        - bearerAuth: []
      tags: [Profile]
      responses:
        "200":
          description: All profiles fetched
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
